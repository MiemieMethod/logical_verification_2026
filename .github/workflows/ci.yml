name: build and deploy Chinese book to gh-pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Chinese book
        run: |
          python3 scripts/build_docs.py
          test -f book_zh/_out/html-multi/index.html
          test -f book_zh/_out/html-multi/逻辑验证漫游指南-2026-桌面版.pdf
          test -f book_zh/_out/html-multi/逻辑验证漫游指南-2026-Pad版.pdf

      - name: Install deploy helper
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Deploy Chinese book to gh-pages
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          touch book_zh/_out/html-multi/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add -B gh-pages gh-pages-worktree origin/gh-pages
          else
            git worktree add --detach gh-pages-worktree
            cd gh-pages-worktree
            git checkout --orphan gh-pages
            cd ..
          fi
          rsync -a --delete --exclude .git book_zh/_out/html-multi/ gh-pages-worktree/
          cd gh-pages-worktree
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to deploy."
          else
            git commit -m "Deploy Chinese book to GitHub Pages"
            git push origin gh-pages
          fi

  lean:
    name: check Lean project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup elan
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none

      - name: Set elan paths
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain
        run: |
          cd lean
          lean --version

      - name: Cache Lake build directory
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}-

      - name: Fetch Mathlib cache
        run: |
          cd lean
          lake exe cache get

      - name: Build Lean project
        run: |
          cd lean
          set +e
          lake build 2>&1 | tee ../lean-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Lean build log tail"
            tail -n 120 ../lean-build.log
            echo "::endgroup::"
            {
              echo "### Lean build failed"
              echo
              echo '```text'
              tail -n 80 ../lean-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|failed|uncaught|unknown|type mismatch|application type mismatch" ../lean-build.log \
              | head -n 20 \
              | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            exit "$status"
          fi
